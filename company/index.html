<style>
  :root { --bg:#101012; --panel:#0b0b0d; --text:#e9e9ec; --muted:#8b8b93; --dim:#56565e; --line:#242428; --accent:#6ee7b7;
          --mono: ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
          --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased; }

  .wrap { max-width:900px; margin:0 auto; padding:0 24px; }

  .top a { font-family:var(--mono); font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
  .top a:hover { color:var(--accent); }
  h1 { font-family:var(--mono); font-size:0.7rem; font-weight:400; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted);
       padding-bottom:9px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  dl { display:grid; grid-template-columns:200px 1fr; column-gap:24px; border:1px solid var(--line); background:var(--panel); padding:4px 22px; }
  dt { font-family:var(--mono); font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); padding:12px 0; border-top:1px solid var(--line); }
  dd { padding:10px 0; border-top:1px solid var(--line); font-size:0.92rem; }
  dt:first-of-type, dd:first-of-type { border-top:0; }
  dd small { display:block; color:var(--muted); font-size:0.78rem; }
  dd a { color:var(--accent); }
  dd a:hover { text-decoration:underline; }
  footer { margin-top:52px; padding:22px 0 48px; border-top:1px solid var(--line); font-size:0.78rem; color:var(--dim);
           display:flex; flex-wrap:wrap; gap:6px 16px; }
  footer a { color:var(--muted); }
  footer a:hover { color:var(--accent); }
  @media (max-width:720px) {
    .top { padding:30px 0 22px; }
    dl { grid-template-columns:1fr; }
    dt { padding-bottom:2px; }
    dd { border-top:0; padding-top:2px; }
  }
